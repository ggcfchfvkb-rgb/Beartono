<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ===== 基础 ===== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c9e6);
scene.fog = new THREE.Fog(0xa9c9e6, 26, 80);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.03, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.7));
const sun = new THREE.DirectionalLight(0xfff4e2, 2.0);
sun.position.set(5, 11, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0xdde3ea, roughness: 0.96 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(120, 120, 0x93a3b8, 0xc3ccd6);
grid.position.y = 0.004;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

/* ===== 脸部贴图 ===== */
const FACE_SIZE = 256;
function drawDefaultFace(ctx, S) {
  ctx.fillStyle = 'rgba(232,120,120,0.18)';
  ctx.beginPath(); ctx.ellipse(S*0.245, S*0.635, S*0.085, S*0.052, 0, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(S*0.755, S*0.635, S*0.085, S*0.052, 0, 0, 6.284); ctx.fill();
  const cx = S*0.5, eyeY = S*0.45, dx = S*0.175, rx = S*0.072, ry = S*0.086;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx-dx, eyeY, rx, ry, 0, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+dx, eyeY, rx, ry, 0, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#4a3128';
  ctx.beginPath(); ctx.arc(cx-dx, eyeY+S*0.006, rx*0.62, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+dx, eyeY+S*0.006, rx*0.62, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx-dx+rx*0.24, eyeY-ry*0.26, rx*0.23, 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+dx+rx*0.24, eyeY-ry*0.26, rx*0.23, 0, 6.284); ctx.fill();
  ctx.strokeStyle = '#4a352a'; ctx.lineWidth = S*0.022; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx-dx-rx*0.95, eyeY-ry*1.62);
  ctx.quadraticCurveTo(cx-dx, eyeY-ry*2.15, cx-dx+rx*0.95, eyeY-ry*1.62); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+dx-rx*0.95, eyeY-ry*1.62);
  ctx.quadraticCurveTo(cx+dx, eyeY-ry*2.15, cx+dx+rx*0.95, eyeY-ry*1.62); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,100,80,0.5)'; ctx.lineWidth = S*0.014;
  ctx.beginPath(); ctx.moveTo(cx, S*0.525); ctx.lineTo(cx, S*0.565); ctx.stroke();
  ctx.strokeStyle = '#b2564c'; ctx.lineWidth = S*0.02;
  ctx.beginPath(); ctx.arc(cx, S*0.625, S*0.075, 0.16*Math.PI, 0.84*Math.PI); ctx.stroke();
}
function createFaceTexture(img, skinColor) {
  const c = document.createElement('canvas');
  c.width = c.height = FACE_SIZE;
  const ctx = c.getContext('2d');
  ctx.fillStyle = skinColor; ctx.fillRect(0, 0, FACE_SIZE, FACE_SIZE);
  if (img) {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if (iw && ih) {
      const s = Math.max(FACE_SIZE/iw, FACE_SIZE/ih);
      ctx.drawImage(img, (FACE_SIZE - iw*s)/2, (FACE_SIZE - ih*s)/2, iw*s, ih*s);
    }
  } else { drawDefaultFace(ctx, FACE_SIZE); }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* ===== 角色 ===== */
const SKIN_COLORS = ['#f3cbaa', '#eab98f', '#d9a273', '#b87c4c', '#8d5524'];
const BODY = { headH: 0.135, torsoH: 0.335, legH: 0.53 };
let uid = 0;
const chars = [];
const state = { mode: 'third', activeId: 0, yaw: Math.PI, pitch: 0.14, dist: 2.6, sceneIndex: 0 };

function makeChar(o) {
  return Object.assign({
    id: ++uid, name: '角色', gender: 'male', height: 1.70,
    skinColor: SKIN_COLORS[0], faceImage: null, group: null, label: null, pose: {}
  }, o);
}
function roundedBox(w, h, d, mat, r = 0.012) {
  const geo = new RoundedBoxGeometry(w, h, d, 2, Math.min(r, Math.min(w,h,d)*0.45));
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function buildCharacter(ch) {
  const g = new THREE.Group();
  const isF = ch.gender === 'female';
  const H = BODY;
  const skinMat = new THREE.MeshStandardMaterial({ color: ch.skinColor, roughness: 0.78 });
  const clothMat = new THREE.MeshStandardMaterial({ color: isF ? 0xd9578c : 0x3f6fb5, roughness: 0.88 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: isF ? 0x4b4a6b : 0x2f3542, roughness: 0.92 });
  const hairMat = new THREE.MeshStandardMaterial({ color: isF ? 0x3a2a1e : 0x2b2118, roughness: 0.9 });
  const headW = isF ? 0.108 : 0.118, headD = 0.118;
  const torsoW = isF ? 0.205 : 0.242, torsoD = isF ? 0.115 : 0.132;
  const legW = torsoW*0.34, legD = torsoD*0.85;
  const armW = torsoW*0.19, armD = torsoD*0.78, armH = 0.44;
  const neckW = torsoW*0.24;

  const legL = new THREE.Group();
  legL.position.set(-torsoW*0.21, H.legH, 0);
  const lm1 = roundedBox(legW, H.legH, legD, pantsMat, 0.014);
  lm1.position.y = -H.legH/2; legL.add(lm1);

  const legR = new THREE.Group();
  legR.position.set(torsoW*0.21, H.legH, 0);
  const lm2 = roundedBox(legW, H.legH, legD, pantsMat, 0.014);
  lm2.position.y = -H.legH/2; legR.add(lm2);

  const torso = new THREE.Group();
  torso.position.y = H.legH;
  const tm = roundedBox(torsoW, H.torsoH, torsoD, clothMat, 0.02);
  tm.position.y = H.torsoH/2; torso.add(tm);
  const neck = roundedBox(neckW, 0.05, neckW, skinMat, 0.01);
  neck.position.y = H.torsoH + 0.012; torso.add(neck);

  const shoulderY = H.torsoH*0.88;
  const armL = new THREE.Group();
  armL.position.set(-(torsoW/2 + armW/2 - 0.006), shoulderY, 0);
  const am1 = roundedBox(armW, armH, armD, clothMat, 0.014);
  am1.position.y = -armH/2; armL.add(am1);
  const armR = new THREE.Group();
  armR.position.set(torsoW/2 + armW/2 - 0.006, shoulderY, 0);
  const am2 = roundedBox(armW, armH, armD, clothMat, 0.014);
  am2.position.y = -armH/2; armR.add(am2);
  torso.add(armL, armR);

  const headPivot = new THREE.Group();
  headPivot.position.y = H.torsoH + 0.036;
  const faceMat = new THREE.MeshStandardMaterial({ map: createFaceTexture(ch.faceImage, ch.skinColor), roughness: 0.82 });
  const headMesh = new THREE.Mesh(new THREE.BoxGeometry(headW, H.headH, headD),
    [skinMat, skinMat, skinMat, skinMat, faceMat, skinMat]);
  headMesh.position.y = H.headH/2;
  headMesh.castShadow = true; headMesh.receiveShadow = true;
  headPivot.add(headMesh);
  const hair = roundedBox(headW*1.06, H.headH*0.5, headD*1.06, hairMat, 0.02);
  hair.position.y = H.headH*0.88;
  headPivot.add(hair);
  torso.add(headPivot);
  g.add(legL, legR, torso);
  g.userData = { legL, legR, torso, armL, armR, headPivot, headMesh };
  return g;
}

const DEFAULT_POSE = { x:0,y:0,z:0,rotY:0,tilt:0,lean:0,headX:0,headY:0,armLX:0,armLZ:0,armRX:0,armRZ:0,legLX:0,legRX:0 };
function setPose(ch, p) {
  ch.pose = Object.assign({}, DEFAULT_POSE, p);
  if (!ch.group) return;
  const u = ch.group.userData, q = ch.pose;
  ch.group.position.set(q.x, q.y, q.z);
  ch.group.rotation.set(0, q.rotY, q.tilt);
  u.torso.rotation.x = q.lean;
  u.headPivot.rotation.set(q.headX, q.headY, 0);
  u.armL.rotation.set(q.armLX, 0, q.armLZ);
  u.armR.rotation.set(q.armRX, 0, q.armRZ);
  u.legL.rotation.x = q.legLX;
  u.legR.rotation.x = q.legRX;
}

/* ===== 名牌 ===== */
function makeLabel(ch) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(16,20,28,0.72)';
  const r = 26, x = 10, y = 22, w = 492, h = 84;
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch.name + ' · ' + Math.round(ch.height*100) + 'cm', 256, 66);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(1.0, 0.25, 1); sp.center.set(0.5, 0);
  return sp;
}
function updateLabel(ch) {
  if (ch.label) {
    scene.remove(ch.label);
    ch.label.material.map.dispose();
    ch.label.material.dispose();
  }
  ch.label = makeLabel(ch);
  scene.add(ch.label);
}
const _v = new THREE.Vector3();
function positionLabel(ch) {
  if (!ch.label || !ch.group) return;
  ch.group.userData.headMesh.getWorldPosition(_v);
  ch.label.position.set(_v.x, _v.y + 0.24, _v.z);
}

/* ===== 道具 ===== */
const propGroup = new THREE.Group();
scene.add(propGroup);
function disposeObj(o) {
  o.traverse(n => {
    if (n.geometry) n.geometry.dispose();
    if (n.material) {
      const ms = Array.isArray(n.material) ? n.material : [n.material];
      ms.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
}
function clearProps() {
  while (propGroup.children.length) {
    const o = propGroup.children[0];
    propGroup.remove(o); disposeObj(o);
  }
}
function addBox(w, h, d, x, y, z, color, rot) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({ color, roughness: 0.86 }));
  m.position.set(x,y,z);
  if (rot) m.rotation.set(rot[0]||0, rot[1]||0, rot[2]||0);
  m.castShadow = true; m.receiveShadow = true;
  propGroup.add(m); return m;
}
function addCyl(rt, rb, h, x, y, z, color, rot) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 18),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 }));
  m.position.set(x,y,z);
  if (rot) m.rotation.set(rot[0]||0, rot[1]||0, rot[2]||0);
  m.castShadow = true; m.receiveShadow = true;
  propGroup.add(m); return m;
}
function addSphere(r, x, y, z, color, emissive) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
  if (emissive) { mat.emissive = new THREE.Color(emissive); mat.emissiveIntensity = 0.9; }
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
  m.position.set(x,y,z); m.castShadow = true;
  propGroup.add(m); return m;
}
function addTorus(r, tube, x, y, z, color, rot) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, 24),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7 }));
  m.position.set(x,y,z);
  if (rot) m.rotation.set(rot[0]||0, rot[1]||0, rot[2]||0);
  m.castShadow = true;
  propGroup.add(m); return m;
}
function addPlane(w, h, x, y, z, color, opacity, rot) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide }));
  m.position.set(x,y,z);
  if (rot) m.rotation.set(rot[0]||0, rot[1]||0, rot[2]||0);
  propGroup.add(m); return m;
}

/* ===== 31 个场景 ===== */
const SCENES = [];
function scene(name, build) { SCENES.push({ name, build }); }
function order(A, B) { return A.height >= B.height ? [A, B] : [B, A]; }

/* ===== 应用场景 ===== */
function applyScene() {
  clearProps();
  chars.forEach(c => setPose(c, {}));
  const [A, B] = chars;
  if (A && B) {
    const sc = SCENES[state.sceneIndex];
    sc.build(A, B);
    document.getElementById('sceneName').textContent = sc.name;
  }
  for (let i = 2; i < chars.length; i++) {
    setPose(chars[i], { x:(i-2)*1.0 + 2.6, z:1.4, rotY:Math.PI });
  }
  scene.updateMatrixWorld(true);
  chars.forEach(c => positionLabel(c));
}

/* ===== 角色增删 ===== */
function buildAndAdd(ch) {
  if (ch.group) { scene.remove(ch.group); disposeObj(ch.group); }
  ch.group = buildCharacter(ch);
  ch.group.scale.setScalar(ch.height);
  scene.add(ch.group);
  updateLabel(ch);
}
function rebuild(ch) { buildAndAdd(ch); applyScene(); }
function addChar() {
  if (chars.length >= 6) return;
  const n = chars.length;
  const ch = makeChar({
    name: '角色' + String.fromCharCode(65 + n),
    gender: n % 2 === 0 ? 'male' : 'female',
    height: n % 2 === 0 ? 1.62 + Math.random()*0.1 : 1.78 + Math.random()*0.1,
    skinColor: SKIN_COLORS[n % SKIN_COLORS.length]
  });
  chars.push(ch);
  buildAndAdd(ch);
  applyScene();
  renderUI();
  refreshSelect();
}
function removeChar(ch) {
  if (chars.length <= 2) return;
  const i = chars.indexOf(ch);
  if (i < 0) return;
  chars.splice(i, 1);
  if (ch.group) { scene.remove(ch.group); disposeObj(ch.group); ch.group = null; }
  if (ch.label) {
    scene.remove(ch.label);
    ch.label.material.map.dispose();
    ch.label.material.dispose();
    ch.label = null;
  }
  if (state.activeId === ch.id && chars.length) state.activeId = chars[0].id;
  applyScene(); renderUI(); refreshSelect();
}

/* ===== UI ===== */
const charListEl = document.getElementById('charList');
const activeSelEl = document.getElementById('activeSel');
const sceneSelEl = document.getElementById('sceneSel');
const addBtn = document.getElementById('addBtn');
const modeSeg = document.getElementById('modeSeg');

SCENES.forEach((sc, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = sc.name;
  sceneSelEl.appendChild(o);
});
sceneSelEl.addEventListener('change', () => {
  state.sceneIndex = parseInt(sceneSelEl.value, 10);
  applyScene();
});

function makeRow(t) {
  const r = document.createElement('div');
  r.className = 'row';
  const l = document.createElement('span');
  l.className = 'lbl'; l.textContent = t;
  r.appendChild(l);
  return r;
}

function renderUI() {
  charListEl.innerHTML = '';
  chars.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'card' + (ch.id === state.activeId ? ' active' : '');
    const head = document.createElement('div');
    head.className = 'card-head';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = ch.gender === 'female' ? '#e07a9f' : '#5b8dd6';
    const nameInput = document.createElement('input');
    nameInput.className = 'name-input';
    nameInput.value = ch.name;
    nameInput.maxLength = 12;
    nameInput.addEventListener('input', () => {
      ch.name = nameInput.value || '角色';
      updateLabel(ch);
      refreshSelect();
      scene.updateMatrixWorld(true);
      positionLabel(ch);
    });
    nameInput.addEventListener('focus', () => setActive(ch.id));
    head.append(dot, nameInput);
    if (chars.length > 2) {
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '×';
      del.title = '删除该角色';
      del.addEventListener('click', () => removeChar(ch));
      head.appendChild(del);
    }
    card.appendChild(head);

    const rowG = makeRow('性别');
    const seg = document.createElement('div');
    seg.className = 'seg';
    [['male','男'],['female','女']].forEach(([val, text]) => {
      const b = document.createElement('button');
      b.textContent = text;
      if (ch.gender === val) b.classList.add('on');
      b.addEventListener('click', () => {
        if (ch.gender === val) return;
        ch.gender = val;
        rebuild(ch);
        renderUI();
      });
      seg.appendChild(b);
    });
    rowG.appendChild(seg);
    card.appendChild(rowG);

    const rowH = makeRow('身高');
    const range = document.createElement('input');
    range.type = 'range';
    range.min = 120; range.max = 230; range.step = 1;
    range.value = Math.round(ch.height*100);
    const hval = document.createElement('span');
    hval.className = 'hval';
    hval.textContent = Math.round(ch.height*100) + 'cm';
    let rafId = 0;
    range.addEventListener('input', () => {
      const cm = parseInt(range.value, 10);
      hval.textContent = cm + 'cm';
      ch.height = cm / 100;
      if (ch.group) ch.group.scale.setScalar(ch.height);
      updateLabel(ch);
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => { rafId = 0; applyScene(); });
    });
    rowH.append(range, hval);
    card.appendChild(rowH);

    const rowF = makeRow('脸图');
    const fileLabel = document.createElement('label');
    fileLabel.className = 'file-btn';
    fileLabel.textContent = ch.faceImage ? '更换图片' : '上传图片';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.hidden = true;
    fileInput.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { ch.faceImage = img; rebuild(ch); renderUI(); URL.revokeObjectURL(url); };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    });
    fileLabel.appendChild(fileInput);
    const resetBtn = document.createElement('button');
    resetBtn.className = 'fr'; resetBtn.textContent = '默认';
    resetBtn.addEventListener('click', () => { ch.faceImage = null; rebuild(ch); renderUI(); });
    rowF.append(fileLabel, resetBtn);
    card.appendChild(rowF);

    card.addEventListener('mousedown', e => {
      const t = e.target.tagName;
      if (t === 'INPUT' || t === 'BUTTON' || t === 'LABEL' || t === 'OPTION') return;
      setActive(ch.id);
    });
    charListEl.appendChild(card);
  });
  addBtn.disabled = chars.length >= 6;
}

function refreshSelect() {
  activeSelEl.innerHTML = '';
  chars.forEach(ch => {
    const o = document.createElement('option');
    o.value = ch.id;
    o.textContent = `${ch.name}（${Math.round(ch.height*100)}cm）`;
    if (ch.id === state.activeId) o.selected = true;
    activeSelEl.appendChild(o);
  });
}
function setActive(id) {
  state.activeId = id;
  refreshSelect();
  document.querySelectorAll('.card').forEach((c, i) => {
    c.classList.toggle('active', chars[i] && chars[i].id === id);
  });
}
activeSelEl.addEventListener('change', () => setActive(parseInt(activeSelEl.value, 10)));
modeSeg.addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  state.mode = btn.dataset.mode;
  modeSeg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
});
addBtn.addEventListener('click', addChar);

/* ===== 相机交互 ===== */
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  state.yaw += dx * 0.0055;
  state.pitch = clamp(state.pitch - dy * 0.0055, -0.85, 1.25);
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointercancel', () => { dragging = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.dist = clamp(state.dist * (1 + Math.sign(e.deltaY) * 0.10), 0.6, 8);
}, { passive: false });
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* ===== 相机更新 ===== */
const HEAD_CENTER_Y = 1 - BODY.headH/2;
function updateCamera() {
  const ch = chars.find(c => c.id === state.activeId) || chars[0];
  if (!ch || !ch.group) return;
  chars.forEach(c => { if (c.group) c.group.userData.headMesh.visible = true; });
  const h = ch.height, p = ch.group.position;
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const dir = new THREE.Vector3(Math.sin(state.yaw)*cp, sp, Math.cos(state.yaw)*cp);
  if (state.mode === 'first') {
    ch.group.userData.headMesh.visible = false;
    const eyeY = p.y + HEAD_CENTER_Y * h;
    camera.position.set(p.x, eyeY, p.z);
    camera.lookAt(p.x + dir.x, eyeY + dir.y, p.z + dir.z);
  } else {
    const target = new THREE.Vector3(p.x, p.y + HEAD_CENTER_Y*h, p.z);
    camera.position.copy(target).addScaledVector(dir, state.dist * h);
    camera.lookAt(target);
  }
  chars.forEach(c => {
    if (!c.label) return;
    c.label.visible = !(state.mode === 'first' && c.id === state.activeId);
  });
}

/* ===== 循环 / 初始化 ===== */
function animate() {
  requestAnimationFrame(animate);
  scene.updateMatrixWorld(true);
  chars.forEach(c => { if (c.label) positionLabel(c); });
  updateCamera();
  renderer.render(scene, camera);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const chA = makeChar({ name: '角色A', gender: 'male', height: 1.85, skinColor: SKIN_COLORS[0] });
const chB = makeChar({ name: '角色B', gender: 'female', height: 1.52, skinColor: SKIN_COLORS[1] });
chars.push(chA, chB);
state.activeId = chA.id;
buildAndAdd(chA);
buildAndAdd(chB);
applyScene();
renderUI();
refreshSelect();
animate();
</script>
</body>
</html>
